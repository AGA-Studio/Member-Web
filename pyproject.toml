[project]
name = "member-web"
version = "0.1.0"
description = "Backend (API) de Member+: SaaS multi-negocio de membresías."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.2",
    "cryptography>=46",
    "email-validator>=2.3.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() en argumentos por defecto es el patrón de FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -ra resume el resultado de todo lo que no es un punto (skips, xfail, fallos);
# --strict-markers/--strict-config convierten una errata en la configuración
# (`@pytest.mark.sloww`, una clave mal escrita) en error, no en un silencio.
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    # Un warning nuevo es una señal: que rompa la suite en vez de acumularse.
    "error",
    # Excepción única y conocida: el TestClient de starlette importa el shim
    # deprecado de httpx y no está en nuestras manos corregirlo.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "slow: tarda más de un segundo (límite de intentos de login, cifrado Argon2id)",
]

[tool.coverage.run]
source = ["api", "core", "db", "models", "schemas", "services", "scripts", "main"]
branch = true
relative_files = true
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == .__main__.:"]
