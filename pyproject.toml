[project]
name = "member-web"
version = "0.1.0"
description = "Backend (API) de Member+: SaaS multi-negocio de membresías."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=46",
    "email-validator>=2.3.0",
    "fastapi>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() en argumentos por defecto es el patrón de FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["api", "core", "db", "models", "schemas", "services", "scripts", "main"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == .__main__.:"]
