name: Bug
description: Algo del sistema no funciona como debe
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: El fallo en una o dos frases.
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: Dónde
      description: Pantalla, endpoint o archivo. Ej. /clientes, POST /customer/create.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Esperado vs real
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Producción
        - Local
        - CI
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Captura, log o salida de comando. Sin datos personales ni credenciales.
