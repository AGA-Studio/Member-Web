name: review

# Revisor automático de PRs contra la wiki y la documentación del repo.
# Comenta lo que contradice docs/REVISION.md; no aprueba, no bloquea y no
# cambia código. Si falla (sin cupo, sin red), el PR sigue su curso.

on:
  # Una sola revisión por PR: al abrirlo, al reabrirlo o cuando deja de ser
  # borrador. Un push posterior no la repite (cuesta ~2.5 min y ~$0.003).
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  # Para volver a revisar a mano desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      pr:
        description: Número del PR a revisar
        required: true

# Un push nuevo cancela la revisión anterior del mismo PR.
concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: review
    # Un `workflow_dispatch` no trae `pull_request`, así que sin la primera
    # condición el run a mano se saltaría el job y quedaría verde sin revisar.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sin OPENCODE_API_KEY (PRs desde forks) el script no hace nada y sale 0.
      #
      # `scripts/review_pr.py` solo usa la librería estándar (argparse, json,
      # urllib, pathlib), así que corre con el Python del runner: instalar uv,
      # Python 3.14 y las dependencias del API costaba ~6 s por revisión para un
      # script que no importa ninguna. Es lo mismo que hace el frontend.
      - name: Revisar contra docs/REVISION.md
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m scripts.review_pr
          --repo "${{ github.repository }}"
          --pr "${{ inputs.pr || github.event.pull_request.number }}"
