# Local database, image storage, plus a full stack for the demo backup.
#   docker compose up -d                    → db + storage (desarrollo diario)
#   docker compose --profile stack up -d    → db + api + web (respaldo de la demo)
#
# El perfil `stack` solo hace pull de imágenes publicadas en GHCR: no construye
# nada. Detalle y cronometraje en docs/DEPLOY.md (sección 9).
services:
  db:
    image: postgres:18
    container_name: memberplus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memberplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memberplus}
      POSTGRES_DB: ${POSTGRES_DB:-memberplus}
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 stores data in /var/lib/postgresql/18/docker,
      # so the volume is mounted at /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for images (RustFS: MinIO stopped publishing
  # its Docker images). API on :9000, web console on
  # http://localhost:9001/rustfs/console/ with the same keys. Guide in docs/STORAGE.md.
  storage:
    image: rustfs/rustfs:1.0.4
    container_name: memberplus-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-memberplus}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-memberplus-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["stack"]
    image: ghcr.io/aga-studio/member-web:${API_IMAGE_TAG:-0.0.1}
    pull_policy: missing
    container_name: memberplus-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Inside the compose network the database is `db:5432`, not localhost:5433.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-memberplus}:${POSTGRES_PASSWORD:-memberplus}@db:5432/${POSTGRES_DB:-memberplus}
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en el entorno o en .env}
      # El stack local es HTTP aunque simule el ensayo.
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # Inside the network the API reaches `storage:9000`; the browser, localhost:9000.
      S3_ENDPOINT_URL: http://storage:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-memberplus}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-memberplus-dev-secret}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["stack"]
    # The :stack tag is built in CI with API_INTERNAL_URL=http://api:8000; the
    # production image hardcodes the public API host and must not be used here.
    image: ghcr.io/aga-studio/member-plus-frontend:${WEB_IMAGE_TAG:-stack}
    pull_policy: missing
    container_name: memberplus-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storagedata:
